services:
  redis:
    image: redis:latest
    container_name: redis_server
    ports:
      - "6380:6379"

  app:
    build:
      context: .
    container_name: redis_app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    working_dir: /app
    command: ["/wait-for-redis.sh", "./build/redis_test"]
